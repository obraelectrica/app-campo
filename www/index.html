function diffLocalidades(filas, nombre){
  const porKey=new Map(), porNom=new Map();
  for(const l of S.localidades.values()){ porKey.set(locKey(l.nombre,l.distrito),l); const k=norm(l.nombre); porNom.set(k, porNom.has(k)?null:l); }
  const items=[], errores=[], vistosLoc=new Set(), vistosSed=new Set();
  // agrupar filas por localidad
  const grupos=new Map();
  for(const f of filas){
    if(f.coordErr) errores.push(f.coordErr);
    let gk;
    if(f.claveLoc && S.localidades.has(f.claveLoc)) gk='id:'+f.claveLoc;
    else { const m=porKey.get(locKey(f.nombre,f.distrito)) || porNom.get(norm(f.nombre)); gk = m ? 'id:'+m.id : 'k:'+locKey(f.nombre,f.distrito); }
    if(!grupos.has(gk)) grupos.set(gk,[]); grupos.get(gk).push(f);
  }
  for(const [gk, fs] of grupos){
    const f0=fs[0];
    const l = gk.startsWith('id:') ? S.localidades.get(gk.slice(3)) : (porKey.get(locKey(f0.nombre,f0.distrito)) || porNom.get(norm(f0.nombre)) || null);
    if(l && vistosLoc.has(l.id)){ errores.push(`Fila ${f0.fila}: "${f0.nombre}" coincide con una localidad ya leída. Se ignoró.`); continue; }
    // nombres de SED: explícitos o por orden
    const usados=new Set(fs.filter(f=>f.sed).map(f=>f.sed)); let c=1;
    const existentes = l ? sedsDe(l.id,true) : [];
    for(const f of fs){ if(f.sed) continue;
      const porClave = f.claveSed && S.seds.get(f.claveSed); if(porClave){ f.sed=porClave.nombre; usados.add(f.sed); continue; }
      while(usados.has('SED '+c)) c++; f.sed='SED '+c; usados.add(f.sed); }
    const vistosNom=new Set(), validas=[];
    for(const f of fs){ if(vistosNom.has(f.sed)){ errores.push(`Fila ${f.fila}: "${f.nombre}" tiene ${f.sed} repetida. Se ignoró.`); continue; } vistosNom.add(f.sed); validas.push(f); }
    if(!l){ items.push({tipo:'nueva', f:f0, seds:validas, alerts:[]}); continue; }
    vistosLoc.add(l.id);
    const campos=[];
    if(f0.nombre!==l.nombre) campos.push(['Nombre','nombre',l.nombre,f0.nombre]);
    if(f0.distrito && f0.distrito!==(l.distrito||'')) campos.push(['Distrito','distrito',l.distrito||'',f0.distrito]);
    if(f0.provincia && f0.provincia!==(l.provincia||'')) campos.push(['Provincia','provincia',l.provincia||'',f0.provincia]);
    if(f0.departamento && f0.departamento!==(l.departamento||'')) campos.push(['Departamento','departamento',l.departamento||'',f0.departamento]);
    if(l.estado==='retirada') items.push({tipo:'rest', l, f:f0, campos, alerts:[]});
    else if(campos.length) items.push({tipo:'mod', l, f:f0, campos, alerts:[]});
    for(const f of validas){
      const s = (f.claveSed && S.seds.get(f.claveSed) && S.seds.get(f.claveSed).localidadId===l.id) ? S.seds.get(f.claveSed) : existentes.find(x=>x.nombre===f.sed);
      if(!s){ items.push({tipo:'sednueva', l, f, alerts:[]}); continue; }
      vistosSed.add(s.id);
      const cs=[];
      if(f.sed!==s.nombre) cs.push(['SED','nombre',s.nombre,f.sed]);
      if(f.coord && (f.coord.este!==s.este || f.coord.norte!==s.norte)) cs.push(['Coordenadas','coordenadas',s.este?`${s.zona} ${s.este} ${s.norte}`:'sin coordenadas',`${f.coord.zona} ${f.coord.este} ${f.coord.norte}`]);
      if(s.estado==='retirada') items.push({tipo:'sedrest', l, s, f, campos:cs, alerts:[]});
      else if(cs.length) items.push({tipo:'sedmod', l, s, f, campos:cs, alerts:[]});
    }
    if(l.estado!=='retirada') for(const s of existentes){ if(vistosSed.has(s.id) || s.estado==='retirada') continue; const nr=registrosSed(s.id); items.push({tipo:'sedret', l, s, alerts: nr?[`Tiene ${nr} registros de avance; se conservan.`]:[]}); }
  }
  for(const l of S.localidades.values()){
    if(vistosLoc.has(l.id) || l.estado==='retirada') continue;
    const nr=registrosLoc(l.id);
    items.push({tipo:'ret', l, alerts: nr?[`Tiene ${nr} registros de avance; se conservan con esta localidad.`]:[]});
  }
  const nret=items.filter(i=>i.tipo==='ret'||i.tipo==='sedret').length;
  const avisos=[]; if(nret>10) avisos.push(`Faltan ${nret} localidades o SED en el archivo. Si no las borraste a propósito, el archivo puede estar incompleto: quedaron sin marcar.`);
  items.forEach((x,k)=>{ x.k=k; x.def=!((x.tipo==='ret'||x.tipo==='sedret') && (nret>10 || x.alerts.length)); });
  return {items, errores, avisos, nombre, primera: S.localidades.size===0};
}

function contarLoc(){ const c=document.querySelectorAll('.dxl:checked').length; const el=$('#dl_cnt'), go=$('#dl_go'); if(el) el.textContent=`${c} de ${S.diffLoc.items.length} cambios marcados`; if(go){ go.textContent=c?`Aplicar ${c} cambio${c>1?'s':''}`:'Aplicar'; go.disabled=!c; } }
async function aplicarLoc(){
  const D=S.diffLoc; if(!D) return;
  const sel=[...document.querySelectorAll('.dxl:checked')].map(c=>D.items[+c.dataset.k]); if(!sel.length) return toast('No marcaste ningún cambio');
  const go=$('#dl_go'); go.disabled=true; go.textContent='Aplicando…';
  let orden=Math.max(0,...[...S.localidades.values()].map(l=>l.orden||0)); let hechos=0;
  const nuevoEstado=D.primera?'original':'agregada';
  const setSed=async(locId,f,est)=>{ await S.db.collection('seds').doc(uid()).set({localidadId:locId, nombre:f.sed, orden:sedNum(f.sed), ...(f.coord||{lat:null,lon:null}), estado:est, creado:nowISO()}); };
  const ok=await w(async()=>{
    for(const x of sel){
      if(x.tipo==='nueva'){ const f=x.f; orden++; const id=uid();
        await S.db.collection('localidades').doc(id).set({nombre:f.nombre, departamento:f.departamento, provincia:f.provincia, distrito:f.distrito, orden, estado:nuevoEstado, creado:nowISO(), ...(f.motivo?{motivo:f.motivo}:{})});
        for(const sf of x.seds) await setSed(id, sf, nuevoEstado); }
      else if(x.tipo==='sednueva'){ await setSed(x.l.id, x.f, 'agregada'); }
      else if(x.tipo==='ret'){ await S.db.doc('localidades/'+x.l.id).update({estado:'retirada', estadoPrevio:x.l.estado||'original', modificado:nowISO()}); }
      else if(x.tipo==='sedret'){ await S.db.doc('seds/'+x.s.id).update({estado:'retirada', estadoPrevio:x.s.estado||'original', modificado:nowISO()}); }
      else {
        const obj = x.s || x.l, coll = x.s ? 'seds' : 'localidades', rest = x.tipo==='rest'||x.tipo==='sedrest';
        const upd={}; const cc=new Set(obj.camposCambiados||[]);
        for(const [,key,,b] of (x.campos||[])){ if(key==='coordenadas') Object.assign(upd, x.f.coord); else upd[key]=b; cc.add(key); }
        if(rest) upd.estado = obj.estadoPrevio && obj.estadoPrevio!=='retirada' ? obj.estadoPrevio : 'original';
        if((x.campos||[]).length){ upd.camposCambiados=[...cc]; const base=rest?upd.estado:obj.estado; if(base!=='agregada') upd.estado='modificada'; }
        if(x.f && x.f.motivo) upd.motivo=x.f.motivo; upd.modificado=nowISO();
        await S.db.doc(coll+'/'+obj.id).update(upd);
      }
      hechos++;
    }
  });
  cerrar(); S.diffLoc=null; if(ok) toast(`${hechos} cambio${hechos>1?'s':''} aplicado${hechos>1?'s':''} en localidades y SED`);
}

}

function partidasVinculables(){ const cx=partidasConexion(), ids=new Set(cx.map(p=>p.id)), g=new Set(cx.map(p=>p.grupo)); return hojas('RS').filter(p=>g.has(p.grupo) && !ids.has(p.id) && p.estado!=='eliminada'); }

const cmpLote = (a,b) => String(a||'').localeCompare(String(b||''),'es',{numeric:true});
function usuariosOrden(list){ return list.sort((a,b)=>((S.localidades.get(a.localidadId)||{}).nombre||'').localeCompare((S.localidades.get(b.localidadId)||{}).nombre||'') || cmpLote(a.mz,b.mz) || cmpLote(a.lote,b.lote)); }

function comprimirSimple(file, max){
  return new Promise((res,rej)=>{ const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      let q=.8, d=c.toDataURL('image/jpeg',q); while(d.length>200000&&q>.3){ q-=.1; d=c.toDataURL('image/jpeg',q); } URL.revokeObjectURL(url); res(d); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('img')); }; img.src=url; });
}

function sbErr(e, ctx){
  if(!e) return;
  const x = new Error(e.message || String(e)); x.code = e.code || ''; x.ctx = ctx;
  const m = (e.message||'') + ' ' + (e.details||'');
  if(x.code==='23505' || /duplicate key/i.test(m)){
    x.code='duplicado';
    x.msg = /medidor/i.test(m) ? 'Ese código de medidor ya está registrado en la obra.' :
            /precinto/i.test(m) ? 'Ese código de precinto ya está registrado en la obra.' : 'Ese registro ya existe.';
  } else if(x.code==='42501' || /row-level security|permission denied|violates row/i.test(m) || e.statusCode==='403' || e.status===403){
    x.code='permiso'; x.msg='No tienes permiso para esta acción.';
  } else if(/JWT|token.*expired|invalid claim|PGRST30/i.test(m) || e.status===401){
    x.code='sesion'; x.msg='La sesión venció. Vuelve a ingresar.';
  } else if(/Failed to fetch|NetworkError|network|Load failed|timeout/i.test(m)){
    x.code='red'; x.msg='Sin conexión a internet. Intenta de nuevo.';
  }
  throw x;
}
const dataURLaBlob = d => { const [h,b]=d.split(','); const mime=(h.match(/:(.*?);/)||[])[1]||'image/jpeg'; const bin=atob(b); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:mime}); };

const IDB = (()=>{
  let dbp=null;
  const abrir=()=> dbp = dbp || new Promise((ok,ko)=>{ try{ const r=indexedDB.open('avance-obra',1);
    r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); if(!d.objectStoreNames.contains('outbox')) d.createObjectStore('outbox',{keyPath:'n',autoIncrement:true}); };
    r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }catch(e){ ko(e); } });
  const tx=async(store,modo,fn)=>{ const d=await abrir(); return new Promise((ok,ko)=>{ const t=d.transaction(store,modo); const st=t.objectStore(store); const r=fn(st); t.oncomplete=()=>ok(r&&r.result); t.onerror=()=>ko(t.error); t.onabort=()=>ko(t.error); }); };
  return {
    get:k=>tx('kv','readonly',s=>s.get(k)).catch(()=>undefined),
    set:(k,v)=>tx('kv','readwrite',s=>s.put(v,k)).catch(e=>console.warn('idb',e)),
    del:k=>tx('kv','readwrite',s=>s.delete(k)).catch(()=>{}),
    encolar:op=>tx('outbox','readwrite',s=>s.add(op)),
    cola:()=>tx('outbox','readonly',s=>s.getAll()).catch(()=>[]),

  };
})();

function aplicarLocal(op){
  if(op.col==='fotos'){
    if(op.datos && op.datos.data){ S.fotoCache.set(op.id, op.datos.data); IDB.set('foto:'+op.id, op.tipo==='update' ? {...(op.previo||{}), ...op.datos} : op.datos); }

    return;

}

async function leerTodo(tabla, cols='id,datos'){
  const out=[]; const N=1000;
  for(let i=0;;i+=N){
    const {data, error} = await SB.from(tabla).select(cols).order('id').range(i, i+N-1);
    if(error) sbErr(error, 'leer '+tabla);

  }

}

const REMOTO = {
  carpeta: d => (d && d.tipo==='usuario') ? 'padron' : 'avances',
  async fotoFicha(id){ const {data, error}=await SB.from('fotos').select('id,datos,ruta').eq('id',id).maybeSingle(); if(error) sbErr(error,'foto'); return data; },
  async fotoSet(id, doc){
    const {data, ...rest} = doc;
    const ruta = `${REMOTO.carpeta(rest)}/${S.me}/${id}.jpg`;
    const up = await SB.storage.from('fotos').upload(ruta, dataURLaBlob(data), {contentType:'image/jpeg', upsert:false});
    if(up.error && !/exists|duplicate/i.test(up.error.message||'')) sbErr(up.error, 'subir foto');
    const {error} = await SB.from('fotos').upsert({id, datos:rest, ruta});
    if(error) sbErr(error, 'ficha foto');
  },
  async fotoUpdate(id, parcial){
    const f = await REMOTO.fotoFicha(id); if(!f) return;              // ya no existe: nada que hacer
    const {data, ...rest} = parcial; let ruta=f.ruta;
    if(data){
      ruta = `${REMOTO.carpeta(f.datos)}/${S.me}/${id}-${Date.now().toString(36)}.jpg`;
      const up = await SB.storage.from('fotos').upload(ruta, dataURLaBlob(data), {contentType:'image/jpeg'});
      if(up.error) sbErr(up.error, 'subir foto');
    }
    const {error} = await SB.from('fotos').update({datos:{...f.datos, ...rest}, ruta}).eq('id', id);
    if(error) sbErr(error, 'ficha foto');
    if(ruta!==f.ruta) SB.storage.from('fotos').remove([f.ruta]).catch(()=>{});
  },
  async fotoDelete(id){
    const f = await REMOTO.fotoFicha(id); if(!f) return;
    const {error} = await SB.from('fotos').delete().eq('id', id); if(error) sbErr(error,'borrar foto');
    await SB.storage.from('fotos').remove([f.ruta]);
  },
  async set(col, id, d){ const {error}=await SB.from(tablaDe(col)).upsert({id, datos:d}); if(error) sbErr(error, 'guardar '+col); },
  async update(col, id, p){
    const t=tablaDe(col);
    const {data:cur,error:e1}=await SB.from(t).select('datos').eq('id',id).maybeSingle(); if(e1) sbErr(e1);
    if(!cur) sbErr({code:'42501', message:'row-level security (no existe o sin permiso)'}, 'actualizar '+col);
    const {data, error}=await SB.from(t).update({datos:{...cur.datos, ...p}}).eq('id',id).select('id');
    if(error) sbErr(error, 'actualizar '+col);
    if(!data || !data.length) sbErr({code:'42501', message:'row-level security'}, 'actualizar '+col);
  },
  async delete(col, id){
    const {data, error}=await SB.from(tablaDe(col)).delete().eq('id',id).select('id');
    if(error) sbErr(error, 'borrar '+col);
    if(!data || !data.length){ const {data:x}=await SB.from(tablaDe(col)).select('id').eq('id',id).maybeSingle(); if(x) sbErr({code:'42501', message:'row-level security'}, 'borrar '+col); }
  },
  async ejecutar(op){
    if(op.col==='fotos'){
      if(op.tipo==='set') return REMOTO.fotoSet(op.id, op.datos);
      if(op.tipo==='update') return REMOTO.fotoUpdate(op.id, op.datos);
      return REMOTO.fotoDelete(op.id);
    }
    if(op.tipo==='set') return REMOTO.set(op.col, op.id, op.datos);
    if(op.tipo==='update') return REMOTO.update(op.col, op.id, op.datos);
    return REMOTO.delete(op.col, op.id);
  }
};

    }
  }
  SYNC.subiendo=false; SYNC.ultimo=Date.now();
  if(hechos){ toast(`Se subieron ${hechos} cambio${hechos>1?'s':''} guardado${hechos>1?'s':''} sin señal`); recargarTodo(); }
  rerender();
}
window.addEventListener('online', ()=>{ SYNC.enLinea=true; rerender(); setTimeout(sincronizar,1000); });
window.addEventListener('offline', ()=>{ SYNC.enLinea=false; rerender(); });
setInterval(()=>{ if(navigator.onLine && SYNC.pendientes) sincronizar(); }, 30000);

function docRef(col, id){
  if(col==='fotos') return {
    id,
    set:d=>escribir({col, id, tipo:'set', datos:d}),
    update:p=>escribir({col, id, tipo:'update', datos:p}),
    delete:()=>escribir({col, id, tipo:'delete'}),
    async get(){
      const loc = await IDB.get('foto:'+id);
      if(loc && loc.data) return {exists:true, id, data:()=>loc};
      const f = await REMOTO.fotoFicha(id); if(!f) return {exists:false, data:()=>undefined};
      const dl = await SB.storage.from('fotos').download(f.ruta); if(dl.error) sbErr(dl.error,'descargar foto');
      const d = {...f.datos, data: await blobADataURL(dl.data)};
      return {exists:true, id, data:()=>d};
    }
  };
  return {
    id,
    set:d=>escribir({col, id, tipo:'set', datos:d}),
    update:p=>escribir({col, id, tipo:'update', datos:p}),
    delete:()=>escribir({col, id, tipo:'delete'}),
    async get(){
      if(CACHE[col] && CACHE[col].has(id)){ const d=CACHE[col].get(id); return {exists:true, id, data:()=>d}; }
      const {data,error}=await SB.from(tablaDe(col)).select('id,datos').eq('id',id).maybeSingle(); if(error) sbErr(error); return {exists:!!data, id, data:()=>data?data.datos:undefined};
    },
    onSnapshot(fn, err){ return suscribir(col, map=>{ const d=map.get(id); fn({exists:!!d, id, data:()=>d}); }, err); }
  };
}

const SUBS = {};
function suscribir(col, fn, err){
  const t = tablaDe(col);
  if(!SUBS[col]){
    const map = CACHE[col] = new Map(); const oyentes = [];
    let lista = false; const aviso = () => { if(lista) oyentes.forEach(f=>f(map)); };
    const recargar = async () => {
      if(!navigator.onLine) return;
      try{
        const rows = await leerTodo(t);
        const pend = (await IDB.cola()).filter(o=>o.col===col);
        map.clear(); rows.forEach(r=>map.set(r.id, r.datos));
        pend.forEach(op=>{ if(op.tipo==='set') map.set(op.id, op.datos); else if(op.tipo==='update') map.set(op.id,{...(map.get(op.id)||{}),...op.datos}); else map.delete(op.id); });
        lista=true; guardarCache(col); aviso();
      }catch(e){ console.error(col, e); if(!lista){ lista=true; aviso(); } }
    };
    SUBS[col] = {map, oyentes, recargar, aviso, get lista(){ return lista; }};
    IDB.get('cache:'+col).then(rows=>{
      if(rows && !lista){ rows.forEach(([id,d])=>map.set(id,d)); lista=true; aviso(); }
      if(!navigator.onLine && !lista){ lista=true; aviso(); }
      SUBS[col].canal = SB.channel('rt-'+t)
        .on('postgres_changes', {event:'*', schema:'public', table:t}, p=>{
          if(p.eventType==='DELETE'){ if(p.old && p.old.id) map.delete(p.old.id); }
          else if(p.new && p.new.id) map.set(p.new.id, p.new.datos);
          guardarCache(col); aviso();
        })
        .subscribe(st=>{ if(st==='SUBSCRIBED') recargar(); });
      recargar();
    });
  }
  const s = SUBS[col]; s.oyentes.push(fn); if(s.lista) fn(s.map);
  return () => { const i=s.oyentes.indexOf(fn); if(i>=0) s.oyentes.splice(i,1); };
}
function recargarTodo(){ Object.values(SUBS).forEach(s=>s.recargar()); }

const DB = {
  collection(col){ return { doc:id=>docRef(col, id), onSnapshot:(fn,err)=>suscribir(col, map=>fn(snapDe(map)), err) }; },
  doc(path){ const [col, id] = path.split('/'); return docRef(col, id); }
};

/* --- Indicador de sincronización --- */
function syncHTML(){
  if(!S.ready) return '';
  const off=!navigator.onLine, p=SYNC.pendientes, f=SYNC.fallidos.length;
  let t='', c='';
  if(off){ t = p ? `Sin señal · ${p} por subir` : 'Sin señal · guardando en el celular'; c='off'; }
  else if(SYNC.subiendo){ t=`Subiendo ${p}…`; c='up'; }
  else if(p){ t=`${p} por subir`; c='off'; }
  let h = t ? `<button class="syncp ${c}" data-act="sincronizar">${esc(t)}</button>` : '';
  if(f) h += `<button class="syncp bad" data-act="verFallidos">${f} no se pudo subir</button>`;
  return h;
}
function mFallidos(){
  const nom=o=>{ const d=o.datos||{}; const p=S.partidas.get(d.partidaId); return o.col==='usuarios'?`Conexión ${d.titular||''} · medidor ${d.medidor||''}`:o.col==='avances'?`Avance ${p?p.codigo:''} · ${fdate(d.fecha||'')}`:o.col==='fotos'?'Foto':`${o.col} ${o.id}`; };
  modal(`<h2>Registros que no se pudieron subir</h2>
    <p class="small muted">El servidor los rechazó al sincronizar. Anota los datos y vuelve a registrarlos corregidos.</p>
    <div class="rec">${SYNC.fallidos.map(x=>`<div class="recitem"><div><b>${esc(nom(x.op))}</b><div class="small">${esc(x.msg)}</div><div class="small muted">${esc(new Date(x.fecha).toLocaleString('es-PE'))}</div></div></div>`).join('')}</div>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-act="cerrar">Cerrar</button><button class="btn danger" data-act="limpiarFallidos">Ya lo revisé, borrar lista</button></div>`, true);
}

/* --- Ubicación del celular (cuando la foto no trae coordenadas) --- */
function ubicacionCelular(){
  return new Promise((ok,ko)=>{
    if(!navigator.geolocation) return ko(new Error('Este equipo no tiene GPS disponible'));
    navigator.geolocation.getCurrentPosition(p=>ok(p.coords), e=>ko(new Error(e.code===1?'Permiso de ubicación denegado. Actívalo en los ajustes del celular.':'No se obtuvo la ubicación. Sal a cielo abierto e intenta de nuevo.')), {enableHighAccuracy:true, timeout:25000, maximumAge:30000});
  });
}
async function geoDelCelular(f, silencioso){
  try{
    if(!silencioso) toast('Obteniendo ubicación del GPS…');
    const c=await ubicacionCelular();
    f.geo=geoCompleto(c.latitude, c.longitude, c.altitude!=null?Math.round(c.altitude*10)/10:null, 'celular', f.fechaFoto||'');
    f.geo.precision=c.accuracy?Math.round(c.accuracy):null; f.repetida='';
    autoLocalidad(); render(); if(!silencioso) toast(`Ubicación registrada (±${f.geo.precision||'?'} m)`);
  }catch(e){ if(!silencioso) toast(e.message); }
}

/* --- ¿Hay una versión nueva de la app? --- */
async function revisarVersion(){
  if(!ES_APK || !navigator.onLine) return;
  try{
    const r=await fetch('https://obraelectrica.github.io/version.json?t='+Date.now(), {cache:'no-store'}); if(!r.ok) return;
    const v=await r.json(); const cmp=(a,b)=>{ const x=String(a).split('.').map(Number), y=String(b).split('.').map(Number); for(let i=0;i<3;i++){ if((x[i]||0)!==(y[i]||0)) return (x[i]||0)-(y[i]||0); } return 0; };
    if(v.apk && cmp(v.apk, APP_VER)>0){ S.nuevaVersion=v; rerender(); }
  }catch(e){}
}

/* ============ Sesión y permisos ============ */
const PERMISOS = [
  ['revision','Revisión','Aprueba u observa los registros de campo'],
  ['metrados','Metrados','Consolidado y comparación de metrados'],
  ['usuarios','Usuarios','Padrón de conexiones con datos personales'],
  ['informes','Informes','Panel fotográfico, exportaciones y reportes'],
  ['partidas','Partidas','Partidas, línea base, localidades y SED'],
  ['admin','Administrador','Todo, más equipo y ajustes del proyecto'],
];
const esOficina = () => !!(S.perfil && S.perfil.activo && S.perfil.rol==='oficina');
const tiene = p => esOficina() && ((S.perfil.permisos||[]).includes(p) || (S.perfil.permisos||[]).includes('admin'));
const rolTxt = pf => !pf ? '' : pf.rol==='oficina'
  ? 'Oficina · ' + ((pf.permisos||[]).includes('admin') ? 'Administrador' : (pf.permisos||[]).map(k=>(PERMISOS.find(x=>x[0]===k)||[,k])[1]).join(', ') || 'solo lectura')

function vLogin(){
  return `<div class="login panel stack">
    <h2>Ingresar</h2>
    <p class="muted small">Usa el correo y la contraseña que te dio el administrador de la obra.</p>
    <label class="f">Correo<input class="i" id="lg_mail" type="email" autocomplete="username" inputmode="email" value="${esc(S.loginMail||'')}"></label>

    ${S.loginErr?`<div class="notice warn"><div>${esc(S.loginErr)}</div></div>`:''}
    <button class="btn primary" data-act="login" ${S.loginBusy?'disabled':''}>${S.loginBusy?'Ingresando…':'Ingresar'}</button>
  </div>`;
}
function vInactivo(){
  return `<div class="login panel stack"><h2>Cuenta pendiente de activación</h2>
    <p>Ingresaste como <b>${esc(S.email||'')}</b>, pero el administrador aún no activa tu cuenta ni te asigna un rol.</p>

    <div class="row"><button class="btn" data-act="recargarPerfil">Ya me activaron</button><button class="btn" data-act="logout">Cerrar sesión</button></div></div>`;
}
async function login(){
  const email=val('lg_mail'), password=$('#lg_pass')?$('#lg_pass').value:''; S.loginMail=email;
  if(!email||!password){ S.loginErr='Escribe tu correo y contraseña.'; return render(); }
  S.loginBusy=true; S.loginErr=''; render();
  const {error} = await SB.auth.signInWithPassword({email, password});
  S.loginBusy=false;
  if(error){ S.loginErr = /invalid/i.test(error.message)?'Correo o contraseña incorrectos.':/fetch|network/i.test(error.message)?'Sin conexión a internet.':error.message; render(); return; }
  await iniciarSesion();
}
async function cargarPerfil(){
  try{
    const {data, error} = await SB.from('perfiles').select('*').eq('id', S.me).maybeSingle();
    if(error) sbErr(error);
    S.perfil = data || null;
    if(data) ident.set({me:S.me, email:S.email, perfil:data});
  }catch(e){
    const id=ident.get(); console.warn('perfil sin conexión', e);
    S.perfil = (id && id.me===S.me) ? id.perfil : null;
  }
}
function mCuenta(){
  modal(`<h2>Mi cuenta</h2>
    <p class="small"><b>${esc(S.email||'')}</b> · ${esc(rolTxt(S.perfil))}</p>
    <label class="f">Nombre que verán los demás<input class="i" id="mc_nom" value="${esc((S.perfil&&S.perfil.nombre)||'')}"></label>
    ${ES_APK?`<p class="small muted">App de campo versión ${APP_VER}</p>`:`<p class="small">📱 <a href="https://github.com/obraelectrica/app-campo/releases/latest/download/obra-electrica.apk">Descargar la app de campo para Android</a> (funciona sin señal)</p>`}
    <label class="f">Nueva contraseña (opcional)<input class="i" id="mc_pass" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres"></label>
    <div class="row between"><button class="btn danger" data-act="logout">Cerrar sesión</button>
      <div class="row"><button class="btn" data-act="cerrar">Cancelar</button><button class="btn primary" data-act="guardarCuenta">Guardar</button></div></div>`);
}
async function guardarCuenta(){
  const nom=val('mc_nom'), pass=$('#mc_pass')?$('#mc_pass').value:'';
  if(pass && pass.length<8) return toast('La contraseña debe tener al menos 8 caracteres');
  const ok = await w(async()=>{
    if(nom && nom!==(S.perfil||{}).nombre){ const {error}=await SB.from('perfiles').update({nombre:nom}).eq('id',S.me); if(error) sbErr(error); S.perfil.nombre=nom; S.names[S.me]=nom; }
    if(pass){ const {error}=await SB.auth.updateUser({password:pass}); if(error) sbErr(error); }
  }, 'Datos guardados');
  if(ok){ cerrar(); render(); }
}
async function logout(){
  await contarCola();
  if(SYNC.pendientes){ toast(`Tienes ${SYNC.pendientes} registro(s) sin subir. Conéctate a internet y espera a que se suban antes de cerrar sesión.`); return; }
  cerrar(); S.saliendo=true; ident.del();
  for(const c of ['partidas','avances','revisiones','frentes','cambios','localidades','seds','usuarios','config']) await IDB.del('cache:'+c);
  try{ await SB.auth.signOut(); }catch(e){} location.reload();
}

/* --- Equipo (solo administrador) --- */
function vEquipo(){
  const ps=[...S.perfiles.values()].sort((a,b)=>(b.activo-a.activo) || (a.nombre||a.email||'').localeCompare(b.nombre||b.email||''));
  const frs=[...S.frentes.values()].filter(f=>!f.inactivo);
  return `<section class="panel stack"><h3>Equipo y permisos</h3>
    <p class="small">Para agregar a alguien: en Supabase entra a <b>Authentication → Users → Add user → Create new user</b>, escribe su correo y una contraseña inicial y marca <b>Auto Confirm User</b>. Aparecerá aquí como <i>inactivo</i>: actívalo y asígnale su rol.</p>
    <div class="tscroll"><table class="t eq"><thead><tr><th>Persona</th><th>Rol</th><th>Permisos de oficina</th><th>Frente</th><th>Activo</th><th></th></tr></thead><tbody>
    ${ps.map(p=>{ const yo=p.id===S.me; const dis=yo?'disabled':''; return `<tr data-pf="${esc(p.id)}">
      <td><input class="i sm" data-pff="nombre" value="${esc(p.nombre||'')}" placeholder="Nombre"><div class="small muted">${esc(p.email||'')}${yo?' · tú':''}</div></td>
      <td><select class="i sm" data-pff="rol" style="min-width:96px" ${dis}><option value="campo" ${p.rol==='campo'?'selected':''}>Campo</option><option value="oficina" ${p.rol==='oficina'?'selected':''}>Oficina</option></select></td>
      <td class="keep">${PERMISOS.map(([k,l,d])=>`<label class="chk small" title="${esc(d)}"><input type="checkbox" data-pfp="${k}" ${(p.permisos||[]).includes(k)?'checked':''} ${dis||(p.rol!=='oficina'?'disabled':'')}> ${l}</label>`).join('')}</td>
      <td><select class="i sm" data-pff="frente" style="min-width:130px"><option value="">—</option>${frs.map(f=>`<option value="${esc(f.id)}" ${p.frente===f.id?'selected':''}>${esc(f.nombre)}</option>`).join('')}</select></td>
      <td><input type="checkbox" data-pff="activo" ${p.activo?'checked':''} ${dis}></td>
      <td><button class="btn sm primary" data-act="guardarPerfil" data-id="${esc(p.id)}">Guardar</button></td></tr>`; }).join('')}
    </tbody></table></div>
    <p class="small muted"><b>Campo</b>: registra avances y conexiones y corrige lo suyo mientras no esté aprobado. <b>Oficina</b>: ve toda la información; cada permiso habilita una tarea. Los datos personales del padrón solo los ve quien tiene <b>Usuarios</b>.</p>
  </section>`;
}
async function guardarPerfil(id){
  const tr=document.querySelector(`tr[data-pf="${CSS.escape(id)}"]`); if(!tr) return;
  const g=k=>tr.querySelector(`[data-pff="${k}"]`);
  const rol=g('rol').value;
  const upd={ nombre:g('nombre').value.trim(), frente:g('frente').value||null };
  if(id!==S.me){ upd.rol=rol; upd.activo=g('activo').checked; upd.permisos= rol==='oficina' ? [...tr.querySelectorAll('[data-pfp]:checked')].map(x=>x.dataset.pfp) : []; }
  await w(async()=>{ const {data,error}=await SB.from('perfiles').update(upd).eq('id',id).select('*'); if(error) sbErr(error); if(!data||!data.length) sbErr({code:'42501',message:'rls'}); S.perfiles.set(id,data[0]); S.names[id]=data[0].nombre; }, 'Permisos guardados');
  render();
}

/* --- Espacio y respaldo --- */
async function cargarEspacio(){ try{ const {data}=await SB.rpc('espacio_usado'); S.espacio=data||null; rerender(); }catch(e){} }
function vEspacio(){
  const e=S.espacio; if(!e) return `<p class="small muted">Calculando espacio usado…</p>`;
  const bar=(v,max,l)=>`<div class="stack" style="gap:4px"><div class="row between small"><span>${l}</span><b>${n(v)} MB de ${n(max)} MB</b></div><div class="track"><div class="fill" style="width:${Math.min(100,v/max*100)}%;${v/max>.8?'background:var(--bad)':''}"></div></div></div>`;
  return bar(e.bd_mb,500,'Base de datos') + bar(e.fotos_mb,1024,`Fotos (${e.fotos_n})`) +
    `<p class="small muted">Plan gratuito de Supabase. Si el proyecto pasa 7 días sin uso se pausa (se reactiva desde el panel de Supabase) y no hay copias automáticas: descarga un respaldo cada semana.</p>`;
}
async function respaldo(){
  if(typeof JSZip==='undefined') return toast('Espera un momento, cargando…');
  toast('Preparando respaldo…');
  await w(async()=>{
    const zip=new JSZip(); const tablas=['config','frentes','partidas','cambios','localidades','seds','avances','revisiones','conexiones','fotos'];
    for(const t of tablas){ const rows=await leerTodo(t, t==='fotos'?'id,datos,ruta':'id,datos'); zip.file(t+'.json', JSON.stringify(rows)); }
    const pf=await leerTodo('perfiles','id,email,nombre,rol,permisos,frente,activo'); zip.file('perfiles.json', JSON.stringify(pf));
    zip.file('LEEME.txt', `Respaldo de "${S.config.nombre||'obra'}" del ${new Date().toLocaleString('es-PE')}.\nContiene todos los registros (sin los archivos de fotos). Para las fotos usa "Descargar carpeta de fotos" en el Panel fotográfico.`);
    await guardarArchivo(`Respaldo_${limpio(S.config.nombre||'obra').slice(0,30).replace(/ /g,'_')}_${hoy()}.zip`, await zip.generateAsync({type:'blob'}));
  });
}

/* ============ Arranque ============ */
async function iniciarSesion(){
  let session=null;
  try{ ({data:{session}} = await SB.auth.getSession()); }catch(e){}
  const id=ident.get();
  if(!session && id && !navigator.onLine){ session={user:{id:id.me, email:id.email}}; S.sinSesion=true; }   // sin señal: sigue con la última sesión
  if(!session){ S.needLogin=true; render(); return; }
  S.needLogin=false; S.me=session.user.id; S.email=session.user.email;
  if(id && id.me!==S.me){ for(const c of ['partidas','avances','revisiones','frentes','cambios','localidades','seds','usuarios','config']) await IDB.del('cache:'+c); }
  await cargarPerfil();
  if(!S.perfil || !S.perfil.activo){ S.inactivo=true; render(); return; }
  S.inactivo=false; S.names[S.me]=S.perfil.nombre||'';
  S.db=DB; S.isOwner=false;
  sub('partidas', s=>{ S.partidas=new Map(s.docs.map(d=>[d.id,{id:d.id,...d.data()}])); });
  sub('avances', s=>{ S.avances=new Map(s.docs.map(d=>[d.id,{id:d.id,...d.data()}])); });
  sub('revisiones', s=>{ S.revs=new Map(s.docs.map(d=>[d.id,d.data()])); });
  sub('frentes', s=>{ S.frentes=new Map(s.docs.map(d=>[d.id,{id:d.id,...d.data()}])); if(!S._frenteOk && S.perfil && S.perfil.frente && S.frentes.has(S.perfil.frente)){ S.form.frente=S.perfil.frente; S._frenteOk=true; } });
  if(esOficina()) sub('cambios', s=>{ S.cambios=s.docs.map(d=>({id:d.id,...d.data()})); });
  sub('localidades', s=>{ S.localidades=new Map(s.docs.map(d=>[d.id,{id:d.id,...d.data()}])); });
  sub('seds', s=>{ S.seds=new Map(s.docs.map(d=>[d.id,{id:d.id,...d.data()}])); });
  sub('usuarios', s=>{ S.usuarios=new Map(s.docs.map(d=>[d.id,{id:d.id,...d.data()}])); });
  S.db.doc('config/proyecto').onSnapshot(s=>{ S.config=s.exists? s.data() : {}; rerender(); }, ()=>{});
  if(esOficina()){
    const cargarPerfiles=async()=>{ const {data}=await SB.from('perfiles').select('*'); S.perfiles=new Map((data||[]).map(p=>[p.id,p])); (data||[]).forEach(p=>{ S.names[p.id]=p.nombre||p.email||''; }); const yo=S.perfiles.get(S.me); if(yo) S.perfil=yo; rerender(); };
    cargarPerfiles();
    SB.channel('rt-perfiles').on('postgres_changes',{event:'*',schema:'public',table:'perfiles'},()=>cargarPerfiles()).subscribe();
    if(tiene('admin')) cargarEspacio();
  }
  let oculto=0;
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) oculto=Date.now(); else if(oculto && Date.now()-oculto>60000){ recargarTodo(); cargarPerfil().then(rerender); } });
  S.ready=true; render();
  contarCola().then(()=>{ rerender(); sincronizar(); });
  revisarVersion();
}
async function boot(){
  render();
  if(!window.supabase || !window.supabase.createClient){ S.noDb=true; render(); return; }
  SB = window.supabase.createClient(SB_URL, SB_KEY, { auth:{ persistSession:true, autoRefreshToken:true } });
  SB.auth.onAuthStateChange(ev=>{ if(ev==='SIGNED_OUT' && S.ready && S.saliendo) location.reload(); if(ev==='SIGNED_IN' && S.sinSesion){ S.sinSesion=false; sincronizar(); } });
  await iniciarSesion();
}

boot();
